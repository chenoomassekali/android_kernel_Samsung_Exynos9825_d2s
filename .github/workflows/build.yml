name: Build RT2800 Magisk Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fix KernelSU
        run: |
          git submodule deinit --all -f 2>/dev/null || true
          rm -rf .git/modules/KernelSU 2>/dev/null || true
          git rm --cached KernelSU 2>/dev/null || true
          sed -i '/kernelsu/Id' drivers/Makefile
          sed -i '/kernelsu/Id' drivers/Kconfig
          sed -i '/KernelSU/Id' drivers/Makefile
          sed -i '/KernelSU/Id' drivers/Kconfig

      - name: Fix CPU Scheduler Conflict
        run: |
          rm -f kernel/sched/cpufreq_nobody_sched.c 2>/dev/null || true
          sed -i '/cpufreq_nobody_sched/d' kernel/sched/Makefile

      - name: Fix DWC3 Conflict
        run: |
          sed -i 's/dwc3_thread_interrupt/dwc3_interrupt/g' drivers/usb/dwc3/gadget.c 2>/dev/null || true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu build-essential bc flex bison libssl-dev libelf-dev python3 wget clang lld llvm zip

      - name: Add RT2800 Config as Module
        run: |
          # Tambah config RT2800 sebagai module (=m bukan =y)
          echo "CONFIG_WLAN_VENDOR_RALINK=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2X00=m" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2X00USB=m" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800USB=m" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800USB_RT2770=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800USB_RT3070=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800USB_UNKNOWN=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800LIB=m" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800MMIO=m" >> arch/arm64/configs/exynos9820-d2s_defconfig

      - name: Build Kernel and Modules
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ANDROID_MAJOR_VERSION=q
          make exynos9820-d2s_defconfig
          # Build kernel dulu (diperlukan untuk build modules)
          make -j$(nproc) KCFLAGS="-w -Wno-error" 2>&1 || true
          # Build modules
          make -j$(nproc) modules KCFLAGS="-w -Wno-error" 2>&1 || true
          # Cari file .ko yang dihasilkan
          echo "=== RT2800 modules found ==="
          find . -name "rt2*.ko" 2>/dev/null
          find . -name "mac80211.ko" 2>/dev/null
          find . -name "cfg80211.ko" 2>/dev/null

      - name: Create Magisk Module
        run: |
          KVER="4.14.356-FrEeRuNnErKeRnEl-v3.7-R3+"
          MODULE_DIR="magisk-rt2800"
          mkdir -p $MODULE_DIR/system/lib/modules/$KVER
          mkdir -p $MODULE_DIR/META-INF/com/google/android

          # Copy semua .ko yang diperlukan
          for ko in rt2x00lib rt2x00usb rt2800lib rt2800usb mac80211 cfg80211; do
            FILE=$(find . -name "${ko}.ko" | head -1)
            if [ -n "$FILE" ]; then
              cp "$FILE" $MODULE_DIR/system/lib/modules/$KVER/
              echo "Copied: $ko.ko"
            else
              echo "WARNING: $ko.ko not found"
            fi
          done

          ls -lh $MODULE_DIR/system/lib/modules/$KVER/

          # Buat module.prop
          cat > $MODULE_DIR/module.prop << 'PROP'
          id=rt2800usb
          name=RT2800USB WiFi Driver
          version=v1.0
          versionCode=1
          author=chenoomassekali
          description=RT2800USB driver untuk adapter WiFi Ralink/MediaTek
          PROP

          # Buat customize.sh untuk load modules otomatis
          cat > $MODULE_DIR/customize.sh << 'SH'
          #!/system/bin/sh
          KVER=$(uname -r)
          MODPATH="/system/lib/modules/$KVER"
          ui_print "- Installing RT2800USB modules for kernel $KVER"
          ui_print "- Module path: $MODPATH"
          SH

          # Buat service.sh untuk insmod saat boot
          mkdir -p $MODULE_DIR
          cat > $MODULE_DIR/service.sh << 'SH'
          #!/system/bin/sh
          KVER=$(uname -r)
          MODPATH="/data/adb/modules/rt2800usb/system/lib/modules/$KVER"

          sleep 10

          insmod $MODPATH/cfg80211.ko 2>/dev/null
          insmod $MODPATH/mac80211.ko 2>/dev/null
          insmod $MODPATH/rt2x00lib.ko 2>/dev/null
          insmod $MODPATH/rt2x00usb.ko 2>/dev/null
          insmod $MODPATH/rt2800lib.ko 2>/dev/null
          insmod $MODPATH/rt2800usb.ko 2>/dev/null

          echo "RT2800USB modules loaded" >> /data/local/tmp/rt2800.log
          lsmod | grep rt28 >> /data/local/tmp/rt2800.log
          SH

          chmod +x $MODULE_DIR/service.sh
          chmod +x $MODULE_DIR/customize.sh

          # Buat update-binary
          cat > $MODULE_DIR/META-INF/com/google/android/update-binary << 'UB'
          #!/sbin/sh
          SKIPUNZIP=1
          unzip -o "$ZIPFILE" 'system/*' -d "$MODPATH"
          unzip -o "$ZIPFILE" 'service.sh' -d "$MODPATH"
          unzip -o "$ZIPFILE" 'customize.sh' -d "$MODPATH"
          set_perm_recursive "$MODPATH" root root 0755 0644
          UB

          # Buat updater-script
          echo "#MAGISK" > $MODULE_DIR/META-INF/com/google/android/updater-script

          # Zip semua jadi Magisk module
          cd $MODULE_DIR
          zip -r ../rt2800usb-magisk.zip .
          cd ..
          ls -lh rt2800usb-magisk.zip

      - name: Upload Magisk Module
        uses: actions/upload-artifact@v4
        with:
          name: rt2800usb-magisk-module
          path: rt2800usb-magisk.zip
