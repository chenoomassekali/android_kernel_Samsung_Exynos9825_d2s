name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fix KernelSU
        run: |
          git submodule deinit --all -f 2>/dev/null || true
          rm -rf .git/modules/KernelSU 2>/dev/null || true
          git rm --cached KernelSU 2>/dev/null || true
          sed -i '/kernelsu/Id' drivers/Makefile
          sed -i '/kernelsu/Id' drivers/Kconfig
          sed -i '/KernelSU/Id' drivers/Makefile
          sed -i '/KernelSU/Id' drivers/Kconfig

      - name: Fix CPU Scheduler Conflict
        run: |
          rm -f kernel/sched/cpufreq_nobody_sched.c 2>/dev/null || true
          sed -i '/cpufreq_nobody_sched/d' kernel/sched/Makefile

      - name: Fix DWC3 Conflict
        run: |
          sed -i 's/dwc3_thread_interrupt/dwc3_interrupt/g' drivers/usb/dwc3/gadget.c 2>/dev/null || true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu build-essential bc flex bison libssl-dev libelf-dev python3

      - name: Add RT2800 Config
        run: |
          echo "CONFIG_WLAN_VENDOR_RALINK=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2X00=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2X00USB=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800USB=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800USB_RT2770=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800USB_RT3070=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800USB_UNKNOWN=y" >> arch/arm64/configs/exynos9820-d2s_defconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ANDROID_MAJOR_VERSION=q
          make exynos9820-d2s_defconfig
          make -j$(nproc) KCFLAGS="-w -Wno-error" 2>&1 || true
          echo "=== Cari semua file Image ==="
          find . -name "Image" -o -name "Image.gz" -o -name "Image.lz4" 2>/dev/null | grep -v "\.git" | grep -v "source"

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel
          # Cari dan copy file Image dari mana saja
          IMAGE=$(find . -name "Image.gz" ! -path "./.git/*" ! -path "./AnyKernel/*" | head -1)
          if [ -z "$IMAGE" ]; then
            IMAGE=$(find . -name "Image" ! -path "./.git/*" ! -path "./AnyKernel/*" | head -1)
          fi
          echo "Image ditemukan di: $IMAGE"
          cp "$IMAGE" AnyKernel/ 2>/dev/null || echo "Copy gagal"
          ls -lh AnyKernel/
          cd AnyKernel
          zip -r9 ../kernel-rt2800-d2s.zip * -x .git README.md
          ls -lh ../kernel-rt2800-d2s.zip

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: kernel-rt2800-d2s
          path: kernel-rt2800-d2s.zip
