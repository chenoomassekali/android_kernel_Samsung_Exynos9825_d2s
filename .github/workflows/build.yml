name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fix KernelSU
        run: |
          git submodule deinit --all -f 2>/dev/null || true
          rm -rf .git/modules/KernelSU 2>/dev/null || true
          git rm --cached KernelSU 2>/dev/null || true
          sed -i '/kernelsu/Id' drivers/Makefile
          sed -i '/kernelsu/Id' drivers/Kconfig
          sed -i '/KernelSU/Id' drivers/Makefile
          sed -i '/KernelSU/Id' drivers/Kconfig

      - name: Fix CPU Scheduler Conflict
        run: |
          rm -f kernel/sched/cpufreq_nobody_sched.c 2>/dev/null || true
          sed -i '/cpufreq_nobody_sched/d' kernel/sched/Makefile

      - name: Fix DWC3 Conflict
        run: |
          sed -i 's/dwc3_thread_interrupt/dwc3_interrupt/g' drivers/usb/dwc3/gadget.c 2>/dev/null || true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu build-essential bc flex bison libssl-dev libelf-dev python3 python3-pip wget unzip
          # Install mkbootimg versi lama yang compatible
          git clone --depth=1 -b android-4.19 https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg-tools 2>/dev/null || \
          git clone --depth=1 https://github.com/xiaolu/mkbootimg_tools mkbootimg-tools2 2>/dev/null || true
          # Coba install dari apt
          sudo apt install -y mkbootimg 2>/dev/null || true
          which mkbootimg && echo "mkbootimg OK" || echo "mkbootimg NOT found"
          which unpackbootimg && echo "unpackbootimg OK" || echo "unpackbootimg NOT found"

      - name: Download Original boot.img
        run: |
          wget -q https://github.com/pho5nix/d2s-los23-nethunter-kernel/releases/download/v1.0/d2s-nh-boot.img -O original-boot.img
          ls -lh original-boot.img

      - name: Add RT2800 Config
        run: |
          echo "CONFIG_WLAN_VENDOR_RALINK=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2X00=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2X00USB=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800USB=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800USB_RT2770=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800USB_RT3070=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800USB_UNKNOWN=y" >> arch/arm64/configs/exynos9820-d2s_defconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ANDROID_MAJOR_VERSION=q
          make exynos9820-d2s_defconfig
          make -j$(nproc) KCFLAGS="-w -Wno-error" 2>&1 || true
          KERNEL=$(find ./out -name "Image.gz" 2>/dev/null | head -1)
          echo "Kernel: $KERNEL"
          ls -lh "$KERNEL"

      - name: Unpack Original boot.img
        run: |
          mkdir -p bootimg-out
          unpackbootimg --boot_img original-boot.img --out bootimg-out
          ls -la bootimg-out/

      - name: Create New boot.img
        run: |
          KERNEL=$(find ./out -name "Image.gz" 2>/dev/null | head -1)
          echo "Kernel: $KERNEL"
          ls -lh bootimg-out/
          # Gunakan Python script sederhana untuk buat boot.img
          python3 << 'EOF'
          import struct, os, sys

          def read_file(path):
              with open(path, 'rb') as f:
                  return f.read()

          def write_file(path, data):
              with open(path, 'wb') as f:
                  f.write(data)

          def pad(data, pagesize):
              if len(data) % pagesize == 0:
                  return data
              return data + b'\x00' * (pagesize - len(data) % pagesize)

          # Read original boot.img header
          with open('original-boot.img', 'rb') as f:
              header = f.read(2048)

          magic = header[0:8]
          assert magic == b'ANDROID!', f"Not Android boot image: {magic}"

          vals = struct.unpack_from('<8I', header, 8)
          kernel_size = vals[0]
          kernel_addr = vals[1]
          ramdisk_size = vals[2]
          ramdisk_addr = vals[3]
          second_size = vals[4]
          second_addr = vals[5]
          tags_addr = vals[6]
          page_size = vals[7]

          cmdline = header[64:576].rstrip(b'\x00').decode('utf-8', errors='replace')
          name = header[32:48].rstrip(b'\x00').decode('utf-8', errors='replace')

          print(f"page_size={page_size}")
          print(f"kernel_addr=0x{kernel_addr:08x}")
          print(f"ramdisk_addr=0x{ramdisk_addr:08x}")
          print(f"tags_addr=0x{tags_addr:08x}")
          print(f"cmdline={cmdline}")

          # Read new kernel
          kernel_data = read_file(os.environ.get('KERNEL_PATH', ''))
          # Read original ramdisk
          ramdisk_data = read_file('bootimg-out/ramdisk')

          # Build new header
          new_kernel_size = len(kernel_data)
          new_ramdisk_size = len(ramdisk_data)

          header_data = struct.pack('<8sIIIIIIII',
              b'ANDROID!',
              new_kernel_size, kernel_addr,
              new_ramdisk_size, ramdisk_addr,
              0, second_addr,
              tags_addr, page_size
          )
          header_data += b'\x00' * 8  # unused
          header_data += name.encode().ljust(16, b'\x00')
          header_data += cmdline.encode().ljust(512, b'\x00')
          header_data += b'\x00' * 8  # id
          header_data += b'\x00' * (page_size - len(header_data))

          # Combine
          output = header_data
          output += pad(kernel_data, page_size)
          output += pad(ramdisk_data, page_size)

          write_file('boot-rt2800-d2s.img', output)
          print(f"boot.img created: {len(output)} bytes")
          EOF
          ls -lh boot-rt2800-d2s.img

        env:
          KERNEL_PATH: ${{ steps.build.outputs.kernel_path }}

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-rt2800-d2s
          path: boot-rt2800-d2s.img
