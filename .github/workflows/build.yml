name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fix KernelSU
        run: |
          git submodule deinit --all -f 2>/dev/null || true
          rm -rf .git/modules/KernelSU 2>/dev/null || true
          git rm --cached KernelSU 2>/dev/null || true
          sed -i '/kernelsu/Id' drivers/Makefile
          sed -i '/kernelsu/Id' drivers/Kconfig
          sed -i '/KernelSU/Id' drivers/Makefile
          sed -i '/KernelSU/Id' drivers/Kconfig

      - name: Fix CPU Scheduler Conflict
        run: |
          rm -f kernel/sched/cpufreq_nobody_sched.c 2>/dev/null || true
          sed -i '/cpufreq_nobody_sched/d' kernel/sched/Makefile

      - name: Fix DWC3 Conflict
        run: |
          sed -i 's/dwc3_thread_interrupt/dwc3_interrupt/g' drivers/usb/dwc3/gadget.c 2>/dev/null || true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu build-essential bc flex bison libssl-dev libelf-dev python3 wget unzip

      - name: Download Original boot.img
        run: |
          wget -q https://github.com/pho5nix/d2s-los23-nethunter-kernel/releases/download/v1.0/d2s-nh-boot.img -O original-boot.img
          ls -lh original-boot.img

      - name: Add RT2800 Config
        run: |
          echo "CONFIG_WLAN_VENDOR_RALINK=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2X00=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2X00USB=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800USB=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800USB_RT2770=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800USB_RT3070=y" >> arch/arm64/configs/exynos9820-d2s_defconfig
          echo "CONFIG_RT2800USB_UNKNOWN=y" >> arch/arm64/configs/exynos9820-d2s_defconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ANDROID_MAJOR_VERSION=q
          make exynos9820-d2s_defconfig
          make -j$(nproc) KCFLAGS="-w -Wno-error" 2>&1 || true
          KERNEL=$(find ./out -name "Image.gz" 2>/dev/null | head -1)
          echo "KERNEL_PATH=$KERNEL" >> $GITHUB_ENV
          echo "Kernel: $KERNEL"
          ls -lh "$KERNEL"

      - name: Repack boot.img
        run: |
          echo "Kernel path: $KERNEL_PATH"
          ls -lh "$KERNEL_PATH"
          python3 << PYEOF
          import struct, os

          def pad_to_page(data, pagesize):
              r = len(data) % pagesize
              if r == 0:
                  return data
              return data + b'\x00' * (pagesize - r)

          with open('original-boot.img', 'rb') as f:
              boot = f.read()

          magic = boot[0:8]
          assert magic == b'ANDROID!', "Not valid Android boot image!"

          (kernel_size, kernel_addr,
           ramdisk_size, ramdisk_addr,
           second_size, second_addr,
           tags_addr, page_size) = struct.unpack_from('<8I', boot, 8)

          os_version = struct.unpack_from('<I', boot, 40)[0]
          name = boot[48:64].rstrip(b'\x00').decode('utf-8', errors='replace')
          cmdline = boot[64:576].rstrip(b'\x00').decode('utf-8', errors='replace')
          extra_cmdline = boot[608:1120].rstrip(b'\x00').decode('utf-8', errors='replace')

          print(f"page_size: {page_size}")
          print(f"kernel_addr: 0x{kernel_addr:08x}")
          print(f"ramdisk_addr: 0x{ramdisk_addr:08x}")
          print(f"tags_addr: 0x{tags_addr:08x}")
          print(f"cmdline: {cmdline}")

          # Extract ramdisk dari boot.img asli
          header_pages = 1
          kernel_pages = (kernel_size + page_size - 1) // page_size
          ramdisk_offset = (header_pages + kernel_pages) * page_size
          ramdisk_data = boot[ramdisk_offset:ramdisk_offset + ramdisk_size]
          print(f"Ramdisk size: {len(ramdisk_data)} bytes")

          # Baca kernel baru
          kernel_path = os.environ['KERNEL_PATH']
          with open(kernel_path, 'rb') as f:
              new_kernel = f.read()
          print(f"New kernel size: {len(new_kernel)} bytes")

          # Build header baru
          hdr = bytearray(page_size)
          struct.pack_into('8s', hdr, 0, b'ANDROID!')
          struct.pack_into('<I', hdr, 8, len(new_kernel))
          struct.pack_into('<I', hdr, 12, kernel_addr)
          struct.pack_into('<I', hdr, 16, len(ramdisk_data))
          struct.pack_into('<I', hdr, 20, ramdisk_addr)
          struct.pack_into('<I', hdr, 24, second_size)
          struct.pack_into('<I', hdr, 28, second_addr)
          struct.pack_into('<I', hdr, 32, tags_addr)
          struct.pack_into('<I', hdr, 36, page_size)
          struct.pack_into('<I', hdr, 40, os_version)
          struct.pack_into('16s', hdr, 48, name.encode().ljust(16, b'\x00'))
          struct.pack_into('512s', hdr, 64, cmdline.encode().ljust(512, b'\x00'))
          struct.pack_into('512s', hdr, 608, extra_cmdline.encode().ljust(512, b'\x00'))

          output = bytes(hdr)
          output += pad_to_page(new_kernel, page_size)
          output += pad_to_page(ramdisk_data, page_size)

          with open('boot-rt2800-d2s.img', 'wb') as f:
              f.write(output)

          print(f"SUCCESS! boot.img size: {len(output)} bytes ({len(output)//1024//1024} MB)")
          PYEOF
          ls -lh boot-rt2800-d2s.img

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-rt2800-d2s
          path: boot-rt2800-d2s.img
